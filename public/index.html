<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BusSin</title>

    <!-- Preconnect Google Fonts for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />

    <!-- Mapbox GL JS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>

    <!-- App Stylesheet -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  </head>
  <body>
    <div id="map"></div>

    <!-- Search Modal / Overlay -->
    <div id="searchModal" class="search-modal" aria-hidden="true">
      <div class="search-modal-backdrop" id="searchModalBackdrop"></div>
      <div class="search-dialog" role="dialog" aria-modal="true" aria-label="Search Bus Stops">
        <div class="search-bar-header">
          <svg class="search-input-icon" width="20" height="20" aria-hidden="true">
            <use href="assets/icons/sprite.svg#search"></use>
          </svg>
          <input
            type="text"
            id="busStopSearchInput"
            class="search-input"
            placeholder="Search road, code, description..."
            autocomplete="off"
            spellcheck="false"
          />
          <button type="button" id="searchClearBtn" class="search-clear-btn" aria-label="Clear search" style="display: none;">
            <svg width="14" height="14" aria-hidden="true">
              <use href="assets/icons/sprite.svg#clear"></use>
            </svg>
          </button>
          <button type="button" id="searchCloseBtn" class="search-close-btn">Cancel</button>
        </div>
        <div id="searchResultsList" class="search-results-list">
          <div class="search-empty-state">Type a road name, bus stop code (e.g. 01012), or description to search.</div>
        </div>
      </div>
    </div>

    <!-- Bottom Sheet -->
    <div id="bottomSheet" class="bottom-sheet">
      <div class="bottom-sheet-content">
        <div class="bottom-sheet-header">
          <div class="header-content">
            <div class="header-left">
              <h1 id="busStopTitle" class="bus-stop-name"></h1>
            </div>
            <div class="header-right">
              <div class="refresh-icon" aria-label="Refresh arrival times">
                <svg width="36" height="36" aria-hidden="true">
                  <use href="assets/icons/sprite.svg#refresh"></use>
                </svg>
              </div>
              <div class="last-updated">
                <span class="update-label">last updated</span>
                <span id="lastUpdate" class="update-time">--:--</span>
              </div>
            </div>
          </div>
        </div>

        <div class="divider"></div>

        <div class="bottom-sheet-body" id="servicesContainer">
          <!-- Service rows inserted dynamically -->
        </div>
      </div>
    </div>

    <!-- Application Entry Point (ES Module) -->
    <script type="module" src="js/app.js"></script>
  </body>
</html>
